<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Outbreak Protocol - Industrial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        body {
            /* Deeper, moodier background */
            background-color: #0b1a2e; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            flex-direction: column;
            font-family: 'Inter', sans-serif;
            padding: 20px;
        }
        canvas {
            border: 4px solid #000000;
            background-color: #000;
            image-rendering: pixelated;
            max-width: 90vw;
            max-height: 90vh;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }
        .controls-info {
            color: #fff;
            margin-top: 20px;
            text-align: center;
        }
        .controls-info kbd {
            display: inline-block;
            padding: 2px 6px;
            border: 1px solid #777;
            border-radius: 3px;
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.2);
            background-color: #222;
            color: #f0f0f0;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            margin: 0 2px;
        }
        h1 {
            color: #00ffaa; /* Neon green/teal title */
            font-family: 'Press Start 2P', monospace;
            text-shadow: 2px 2px #000;
            margin-bottom: 10px;
        }
        .message-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            border: 4px solid #00ffaa; /* Neon border */
            border-radius: 10px;
            padding: 20px 40px;
            color: #fff;
            text-align: center;
            font-family: 'Press Start 2P', monospace;
            z-index: 10;
            display: none;
            box-shadow: 0 0 20px #00ffaa;
        }
    </style>
</head>
<body>

    <h1 class="text-2xl sm:text-4xl">OUTBREAK PROTOCOL</h1>
    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <div class="controls-info">
        <p>
            <kbd>A</kbd> <kbd>D</kbd> - Move |
            <kbd>W</kbd> - Jump |
            <kbd>Space</kbd> - Shoot |
            <kbd>Tab</kbd> - Switch Weapon
        </p>
    </div>

    <div id="messageBox" class="message-box">
        <p id="messageText"></p>
        <button onclick="startGame()" class="mt-4 bg-red-600 hover:bg-red-700 text-white py-2 px-4 rounded-md text-sm cursor-pointer shadow-lg transition duration-150">
            Restart
        </button>
    </div>

    <script>
        // --- Game Setup ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const messageBox = document.getElementById('messageBox');
        const messageText = document.getElementById('messageText');

        // Game Constants
        const GRAVITY = 0.5;
        const PLAYER_ACCEL = 0.5; 
        const PLAYER_MAX_SPEED = 4;
        const JUMP_FORCE = -12;
        const PROJECTILE_SPEED = 10;
        const FRICTION = 0.9; 

        let gameLoopInterval;
        let isGameOver = false;

        // Key State
        const keys = {
            a: false,
            d: false,
            w: false,
            space: false,
            tab: false
        };
        
        let canFire = true;
        let canSwitch = true; 

        // Player object
        let player = {
            x: 50,
            y: 300,
            width: 15,
            height: 30,
            vx: 0,
            vy: 0,
            onGround: false,
            health: 3,
            color: '#ff4d4d',
            facing: 1, 
            isInvincible: false,
            invincibleTimer: 0,
            invincibleDuration: 120,
            currentWeapon: 'Bullet'
        };

        let particles = []; 

        // Function to handle player damage and respawn 
        function takeDamageAndRespawn() {
            if (player.isInvincible) {
                const enemyVx = enemies.find(e => e.isAlive && 
                    player.x < e.x + e.width && player.x + player.width > e.x &&
                    player.y < e.y + e.height && player.y + player.height > e.y)?.vx || 0;
                player.vx = enemyVx > 0 ? -10 : 10;
                return; 
            }

            player.health -= 1;
            
            player.x = 50; 
            player.y = 300;
            player.vy = 0; 
            
            player.isInvincible = true;
            player.invincibleTimer = player.invincibleDuration;
            
            if (player.health <= 0) {
                endGame("Game Over! You were defeated by the outbreak.");
            }
        }

        // Particle class 
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 5;
                this.vy = Math.random() * -5; 
                this.life = 30;
                this.color = color;
            }
            update() {
                this.vy += GRAVITY * 0.5;
                this.x += this.vx;
                this.y += this.vy;
                this.life--;
            }
            draw() {
                if (this.life > 0) {
                    ctx.fillStyle = this.color;
                    ctx.globalAlpha = this.life / 30;
                    ctx.fillRect(this.x, this.y, 2, 2);
                    ctx.globalAlpha = 1.0;
                }
            }
        }

        // Base Enemy class 
        class Enemy {
            constructor(x, y, width, height, color, health = 1, patrolRange = 50) {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
                this.color = color;
                this.vx = -1; 
                this.vy = 0;
                this.onGround = false;
                this.health = health;
                this.isAlive = true;
                this.patrolRange = patrolRange;
                this.startX = x;
            }

            draw() {
                if (!this.isAlive) return;
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.width, this.height);
                ctx.fillStyle = '#654321';
                ctx.fillRect(this.x + (this.vx < 0 ? this.width : -5), this.y + 10, 10, 3);
            }

            update(platforms) {
                if (!this.isAlive) return;
                if (this.x < this.startX - this.patrolRange || this.x > this.startX + this.patrolRange) {
                    this.vx *= -1;
                }
                this.x += this.vx;
                this.vy += GRAVITY;
                this.y += this.vy;
                this.onGround = false;
                this.handleCollision(platforms);

                if (
                    player.x < this.x + this.width && player.x + player.width > this.x &&
                    player.y < this.y + this.height && player.y + player.height > this.y
                ) {
                    takeDamageAndRespawn();
                }
            }

            handleCollision(platforms) {
                platforms.forEach(p => {
                    if (
                        this.x < p.x + p.width && this.x + this.width > p.x &&
                        this.y < p.y + p.height && this.y + this.height > p.y
                    ) {
                        const prevY = this.y - this.vy;
                        if (this.vy > 0 && prevY + this.height <= p.y) {
                            this.y = p.y - this.height;
                            this.vy = 0;
                            this.onGround = true;
                        } else if (this.vy < 0 && prevY >= p.y + p.height) {
                            this.y = p.y + p.height;
                            this.vy = 0;
                        } else {
                            this.vx *= -1;
                        }
                    }
                });
            }
        }

        class HeavyEnemy extends Enemy {
            constructor(x, y) {
                super(x, y, 20, 35, '#990000', 2, 80); 
                this.startX = x;
            }
        }

        // Base Projectile class
        class Projectile {
            constructor(x, y, direction, damage = 1) {
                this.x = x;
                this.y = y;
                this.width = 8;
                this.height = 3;
                this.vx = direction * PROJECTILE_SPEED;
                this.isLive = true;
                this.color = '#ffcc00'; 
                this.damage = damage;
                this.spawnTime = Date.now();
            }

            draw() {
                if (!this.isLive) return;
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.width, this.height);
            }

            update() {
                if (!this.isLive) return;
                this.x += this.vx;

                for (const p of platforms) {
                    if (
                        this.x < p.x + p.width && this.x + this.width > p.x &&
                        this.y < p.y + p.height && this.y + this.height > p.y
                    ) {
                        this.isLive = false;
                        return;
                    }
                }
                
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.isLive = false;
                    return;
                }

                enemies.forEach(enemy => {
                    if (enemy.isAlive &&
                        this.x < enemy.x + enemy.width && this.x + this.width > enemy.x &&
                        this.y < enemy.y + enemy.height && this.y + enemy.height > enemy.y
                    ) {
                        this.isLive = false;
                        enemy.health -= this.damage;
                        for(let i=0; i<3; i++) {
                            particles.push(new Particle(enemy.x + enemy.width/2, enemy.y + enemy.height/2, '#7CFC00')); 
                        }

                        if (enemy.health <= 0) {
                            enemy.isAlive = false;
                            for(let i=0; i<10; i++) {
                                particles.push(new Particle(enemy.x + enemy.width/2, enemy.y + enemy.height/2, '#7CFC00')); 
                            }
                            checkWinCondition();
                        }
                    }
                });
            }
        }

        // Grenade Projectile 
        class Grenade extends Projectile {
            constructor(x, y, direction) {
                super(x, y, direction, 3);
                this.width = 4;
                this.height = 4;
                this.color = '#ff9900'; 
                this.vx = direction * 8;
                this.vy = -10;
                this.bounces = 0;
                this.isSpawning = true; 
            }
            update() {
                if (!this.isLive) return;

                if (Date.now() - this.spawnTime > 100) { 
                    this.isSpawning = false;
                }
                
                this.vy += GRAVITY * 0.8;
                this.x += this.vx;
                this.y += this.vy;

                platforms.forEach(p => {
                    if (
                        !this.isSpawning && 
                        this.x < p.x + p.width && this.x + this.width > p.x &&
                        this.y < p.y + p.height && this.y + this.height > p.y
                    ) {
                        const prevY = this.y - this.vy;

                        if (this.vy > 0 && prevY + this.height <= p.y) {
                            this.y = p.y - this.height;
                            this.vy *= -0.7;
                            this.vx *= 0.95;
                            this.bounces++;
                        } else if (this.x + this.width - this.vx <= p.x || this.x - this.vx >= p.x + p.width) {
                            this.vx *= -0.8;
                            this.bounces++;
                        }
                        
                        if (this.bounces > 4 || (this.bounces > 0 && Math.abs(this.vy) < 1 && Math.abs(this.vx) < 1)) {
                            this.isLive = false;
                        }
                    }
                });

                enemies.forEach(enemy => {
                    if (enemy.isAlive &&
                        this.x < enemy.x + enemy.width && this.x + this.width > enemy.x &&
                        this.y < enemy.y + enemy.height && this.y + enemy.height > enemy.y
                    ) {
                        this.isLive = false;
                        enemy.health -= this.damage; 
                        for(let i=0; i<15; i++) {
                            particles.push(new Particle(enemy.x + enemy.width/2, enemy.y + enemy.height/2, '#FF4500')); 
                        }
                        if (enemy.health <= 0) {
                            enemy.isAlive = false;
                        }
                        checkWinCondition();
                    }
                });
            }
        }


        // ------------------------------------------------------------------
        // NEW BACKGROUND THEME: Dark Industrial/Sewer Outbreak
        // ------------------------------------------------------------------

        const platforms = [
            // Sewer Floor (Dark Gray/Green Sludge Color)
            { x: 0, y: 350, width: 800, height: 50, color: '#31394a' }, /* Industrial Gray */
            { x: 0, y: 340, width: 800, height: 10, color: '#4a5465' }, /* Top Grate */

            // Floating Platform 1 (Pipe structure)
            { x: 0, y: 300, width: 250, height: 20, color: '#006460' }, /* Green Pipe */
            { x: 250, y: 300, width: 10, height: 20, color: '#6d6d6d' }, /* Connector */

            // Floating Platform 2 (Metal Walkway)
            { x: 400, y: 250, width: 300, height: 20, color: '#4a5465' }, /* Metal Walkway */
            { x: 400, y: 270, width: 300, height: 10, color: '#006460' }, /* Pipe Underneath */

            // Walls and Ceiling (Concrete/Rebar)
            { x: 0, y: 0, width: 800, height: 40, color: '#4d4d4d' }, /* Ceiling */
            { x: 0, y: 0, width: 20, height: 350, color: '#4d4d4d' }, /* Left Wall */
            { x: 780, y: 0, width: 20, height: 350, color: '#4d4d4d' }, /* Right Wall */

            // Inner Ledgess
            { x: 100, y: 150, width: 150, height: 20, color: '#6d6d6d' }, /* Small metal shelf */
            { x: 500, y: 120, width: 100, height: 20, color: '#6d6d6d' }, /* Higher metal shelf */
        ];

        const environmentElements = [
            // Background Wall Color (Dark, Grungy Blue/Grey)
            { x: 20, y: 40, width: 760, height: 310, color: '#1c2838' }, 

            // Pipes/Vents (Drawing only)
            { x: 50, y: 50, width: 10, height: 100, color: '#6d6d6d' },
            { x: 700, y: 50, width: 50, height: 10, color: '#006460' },

            // Access Points (Instead of doors)
            { x: 150, y: 260, width: 40, height: 40, color: '#33394a' }, /* Access Hatch 1 */
            { x: 350, y: 260, width: 40, height: 40, color: '#33394a' }, /* Access Hatch 2 */
            { x: 550, y: 200, width: 40, height: 40, color: '#33394a' }, /* Access Hatch 3 */
            { x: 730, y: 200, width: 40, height: 40, color: '#33394a' }, /* Access Hatch 4 */
        ];

        let enemies = [];
        let projectiles = [];
        
        // --- Initialization ---

        function initGame() {
            player.x = 50; 
            player.y = 300;
            player.vx = 0;
            player.vy = 0;
            player.health = 3;
            player.isInvincible = false;
            player.invincibleTimer = 0;
            player.currentWeapon = 'Bullet';

            // Enemy placement adjusted for the new, more complex industrial layout
            enemies = [
                new Enemy(300, 270, 15, 30, '#006400', 1, 100), // Ground 1 (Long pipe)
                new HeavyEnemy(450, 215), // Mid-level Walkway
                new Enemy(700, 310, 15, 30, '#006400', 1, 50), // Main Floor far right
                new Enemy(150, 120, 15, 30, '#006400', 1, 50) // Floating shelf
            ];
            projectiles = [];
            particles = [];
            canFire = true;
            canSwitch = true;
        }

        // --- Event Handlers (Working) ---

        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            
            if (keys.hasOwnProperty(key)) {
                keys[key] = true;
                e.preventDefault();
            }
            
            if (key === 'space' && canFire && !isGameOver) { 
                fireProjectile();
                canFire = false; 
            }
            
            if (key === 'tab' && canSwitch && !isGameOver) { 
                player.currentWeapon = (player.currentWeapon === 'Bullet') ? 'Grenade' : 'Bullet';
                canSwitch = false; 
                e.preventDefault();
            }

            if (keys.w && player.onGround && !isGameOver) { 
                player.vy = JUMP_FORCE;
                player.onGround = false;
            }
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (keys.hasOwnProperty(key)) {
                keys[key] = false;
            }
            
            if (key === 'space') {
                canFire = true; 
            }
            if (key === 'tab') { 
                canSwitch = true; 
            }
        });

        function fireProjectile() {
            if (isGameOver) return;
            const WeaponClass = player.currentWeapon === 'Bullet' ? Projectile : Grenade;

            const startX = player.x + (player.facing > 0 ? player.width : -8);
            const startY = player.y + player.height / 2 - 1;
            
            projectiles.push(new WeaponClass(startX, startY, player.facing));
        }

        // --- Game Loop Functions ---

        function updatePlayer() {
            if (isGameOver) return;

            let targetVx = 0;
            if (keys.a) {
                targetVx = -PLAYER_ACCEL;
                player.facing = -1;
            }
            if (keys.d) {
                targetVx = PLAYER_ACCEL;
                player.facing = 1;
            }
            
            player.vx += targetVx;
            player.vx = player.vx * FRICTION; 

            player.vx = Math.max(-PLAYER_MAX_SPEED, Math.min(PLAYER_MAX_SPEED, player.vx));

            if (Math.abs(player.vx) < 0.1 && targetVx === 0) {
                player.vx = 0;
            }

            player.vy += GRAVITY;

            const prevX = player.x;
            const prevY = player.y;

            player.x += player.vx;
            player.y += player.vy;

            let landing = false;

            for (const p of platforms) {
                if (
                    player.x < p.x + p.width && player.x + player.width > p.x &&
                    player.y < p.y + p.height && player.y + player.height > p.y
                ) {
                    if (prevX + player.width <= p.x && player.x + player.width > p.x) {
                        player.x = p.x - player.width;
                        player.vx = 0;
                    } else if (prevX >= p.x + p.width && player.x < p.x + p.width) {
                        player.x = p.x + p.width;
                        player.vx = 0;
                    } 
                    
                    if (prevY + player.height <= p.y && player.y + player.height > p.y) {
                        player.y = p.y - player.height;
                        player.vy = 0;
                        landing = true;
                    } else if (prevY >= p.y + p.height && player.y < p.y + player.height) {
                        player.y = p.y + player.height;
                        player.vy = 0;
                    }
                }
            }
            
            player.onGround = landing;

            player.x = Math.max(20, Math.min(canvas.width - 20 - player.width, player.x));
            
            if (player.y > canvas.height + 50) {
                takeDamageAndRespawn();
            }
        }

        function updateGame() {
            if (isGameOver) return;

            updatePlayer();

            if (player.isInvincible) {
                player.invincibleTimer--;
                if (player.invincibleTimer <= 0) {
                    player.isInvincible = false;
                }
            }
            
            enemies.forEach(e => e.update(platforms));

            projectiles.forEach(p => p.update());
            projectiles = projectiles.filter(p => p.isLive);

            particles.forEach(p => p.update());
            particles = particles.filter(p => p.life > 0);
        }

        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            environmentElements.forEach(e => {
                ctx.fillStyle = e.color;
                ctx.fillRect(e.x, e.y, e.width, e.height);
            });

            platforms.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.width, p.height);
            });

            projectiles.forEach(p => p.draw());
            enemies.forEach(e => e.draw());
            particles.forEach(p => p.draw());

            ctx.fillStyle = player.color;
            if (player.isInvincible && player.invincibleTimer % 10 < 5) {
                ctx.globalAlpha = 0.5;
            }
            
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.globalAlpha = 1.0; 
            
            // Draw player's weapon sprite
            ctx.fillStyle = '#444';
            if (player.currentWeapon === 'Bullet') {
                ctx.fillRect(player.x + (player.facing > 0 ? player.width : -5), player.y + 10, 10, 3);
            } else {
               ctx.fillStyle = '#8B4513';
               ctx.fillRect(player.x + (player.facing > 0 ? player.width : -5), player.y + 10, 5, 5);
            }

            // Draw HUD 
            ctx.fillStyle = '#fff';
            ctx.font = '10px "Press Start 2P"';
            ctx.fillText(`HEALTH: ${'♥️'.repeat(player.health)}`, 25, 20);
            ctx.fillText(`ENEMIES: ${enemies.filter(e => e.isAlive).length}`, canvas.width - 150, 20);
            ctx.fillText(`WEAPON: ${player.currentWeapon}`, 25, 40);
        }

        function gameLoop() {
            updateGame();
            drawGame();
        }

        function checkWinCondition() {
            if (enemies.filter(e => e.isAlive).length === 0) {
                endGame("VICTORY! All threats neutralized.");
            }
        }

        function endGame(message) {
            isGameOver = true;
            clearInterval(gameLoopInterval);
            messageText.textContent = message;
            messageBox.style.display = 'block';
        }

        function startGame() {
            messageBox.style.display = 'none';
            initGame();
            if (gameLoopInterval) {
                clearInterval(gameLoopInterval);
            }
            gameLoopInterval = setInterval(gameLoop, 1000 / 60); 
            drawGame();
        }

        window.onload = startGame;

        // --- Firebase setup for environment constraint, not game logic ---
        const appId = typeof window._app_id !== 'undefined' ? window._app_id : 'default-app-id';
        const firebaseConfig = typeof window._firebase_config !== 'undefined' ? JSON.parse(window._firebase_config) : {};
        const initialAuthToken = typeof window._initial_auth_token !== 'undefined' ? window._initial_auth_token : null;
        // ------------------------------------------------------------------
    </script>
</body>
</html>
